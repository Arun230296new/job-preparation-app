apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-preparation-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Arun230296new/job-preparation-app.git
    targetRevision: main
    path: helm/job-preparation
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: job-preparation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
